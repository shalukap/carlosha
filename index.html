<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlosha | Luxury Digital Solutions & Experience Design</title>
    <meta name="description" content="Carlosha is a boutique digital agency crafting high-end, bespoke web and mobile experiences. We specialize in luxury design and industrial-scale innovation." />
    
    <!-- Styles are imported in index.tsx for Vite/Tailwind v4 processing -->
  </head>
  <body class="bg-obsidian overflow-x-hidden">
    <div id="root"></div>
    
    <!-- Custom Cursor -->
    <div id="cursor" class="custom-cursor"></div>
    <div id="cursor-blur" class="fixed w-96 h-96 bg-electric/20 blur-[120px] rounded-full pointer-events-none -z-10 transition-all duration-300"></div>

    <script type="module" src="/index.tsx"></script>
    
    <script>
      const cursor = document.getElementById('cursor');
      const cursorBlur = document.getElementById('cursor-blur');

      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        
        cursorBlur.style.left = (e.clientX - 192) + 'px';
        cursorBlur.style.top = (e.clientY - 192) + 'px';
      });

      document.addEventListener('mousedown', () => {
        cursor.style.transform = 'translate(-50%, -50%) scale(0.8)';
      });

      document.addEventListener('mouseup', () => {
        cursor.style.transform = 'translate(-50%, -50%) scale(1)';
      });
      
      // Initial positioning to avoid jump
      cursor.style.transform = 'translate(-50%, -50%)';
    </script>
  </body>
</html>
